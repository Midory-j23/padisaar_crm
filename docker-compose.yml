services:
  db:
    image: postgres:16-alpine
    container_name: padisaar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: padisaar_crm
    ports:
      - "5434:5432"
    volumes:
      - padisaar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d padisaar_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  padisaar_pg_data:
